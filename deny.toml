[graph]
# Feature-gated dependencies (mcp, keychain, local-models) carry advisories too.
all-features = true

[advisories]
version = 2
# "all" means check all crates (workspace + transitive) for unmaintained advisories.
unmaintained = "all"
yanked = "warn"
# An ignore that matches nothing fails the check, so none outlives the lock file it was written for.
unused-ignored-advisory = "deny"

# Ignore advisories for unmaintained crates that have no safe upgrade path.
# TODO: paste comes from nalgebra/simba; upgrade path blocked on upstream (RUSTSEC-2024-0436)
# chrono is unmaintained with no vulnerability reported (RUSTSEC-2026-0543). It enters the tree only
# through rmcp, which the `mcp` feature enables; rmcp 3.10, its newest release, requires it. Drop this
# when rmcp moves to jiff or time.
# zbus, zvariant and their derive crates are unmaintained as standalone crates (RUSTSEC-2026-0370,
# -0371, -0372) with no vulnerability reported. They enter the tree only through secret-service,
# which the `keychain` feature enables for the Linux Secret Service key provider. Drop these when
# secret-service moves to a maintained zbus.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is a transitive dep via nalgebra/simba; no upstream fix available" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; required by rmcp 3.10 (mcp feature); no rmcp release without it" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained; required by secret-service via zbus (keychain feature); no fixed release" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained; required by secret-service via zbus (keychain feature); no fixed release" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained; required by secret-service via zbus (keychain feature); no fixed release" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "Apache-2.0 WITH LLVM-exception",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
