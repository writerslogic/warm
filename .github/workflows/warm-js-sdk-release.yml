name: JavaScript SDK release

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated portable client to npm
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/js-sdk.yml

  publish:
    name: Publish warm-sdk to npm
    if: startsWith(github.ref, 'refs/tags/sdk-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-sdk-dist
          path: dist
      - name: Attest client and dependency inventory
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tgz
            dist/*.cdx.json
      - name: Publish the verified client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SDK_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          archive="./dist/warm-sdk-${SDK_VERSION}.tgz"
          test -f "$archive"
          if npm view "warm-sdk@${SDK_VERSION}" dist.integrity --json > existing-integrity.json; then
            node - "$archive" <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const actual = 'sha512-' + crypto.createHash('sha512').update(fs.readFileSync(process.argv[2])).digest('base64');
          const existing = JSON.parse(fs.readFileSync('existing-integrity.json', 'utf8'));
          if (actual !== existing) throw new Error('Published SDK differs from the verified archive');
          JS
          else
            npm publish "$archive" --provenance --access public
          fi

  verify-published:
    name: Verify the installed registry client
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-sdk-test-server
          path: server
      - name: Verify signatures and real-server ESM/CJS consumers
        env:
          WARM_SERVER_BIN: ${{ github.workspace }}/server/warm-server
          WARM_SDK_PACKAGE: warm-sdk@${{ needs.build.outputs.version }}
        run: |
          chmod +x "$WARM_SERVER_BIN"
          npm --prefix bindings/js/warm-sdk run test:package
