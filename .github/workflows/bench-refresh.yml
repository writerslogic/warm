# CI validates the comparison harness and generated table.
name: bench-refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "benchmarks/competitive/**"
      - "benchmarks/results/competitive/**"
      - "docs/benchmarks/**"
      - ".github/workflows/bench-refresh.yml"
  pull_request:
    paths:
      - "benchmarks/competitive/**"
      - "benchmarks/results/competitive/**"
      - "docs/benchmarks/**"
      - ".github/workflows/bench-refresh.yml"

permissions:
  contents: read

concurrency:
  group: bench-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Generator tests (every table cell traces to a committed results file)
        run: uv run --no-project --python 3.13 --with pytest --with numpy==2.5.4 pytest -q benchmarks/competitive/tests
