#
# Retires superseded npm names once their replacements are on the registry. `abandoned` tries to
# unpublish the holographic-memory* family and the unused warm-sdk-<platform> packages (roots
# first, so their platform packages lose their only dependent) and deprecates whatever registry
# policy refuses to delete. The `renamed-*` groups deprecate names that users still install,
# pointing each at its replacement; they are never unpublished.
name: Retire legacy npm packages

on:
  workflow_dispatch:
    inputs:
      group:
        description: Legacy package group to retire after its replacement is available
        type: choice
        options: [abandoned, renamed-engine, renamed-mcp, renamed-adapters]
      apply:
        description: Change the registry (false lists what would change)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Apply the registry's unpublish and deprecation policy to the exact legacy names
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GROUP: ${{ inputs.group }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          npm whoami
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const suffixes = ['darwin-arm64', 'darwin-x64', 'linux-arm64-gnu', 'linux-arm64-musl', 'linux-x64-gnu', 'linux-x64-musl', 'win32-arm64-msvc', 'win32-x64-msvc'];
          const adapters = ['core', 'claude-tool', 'langchain', 'llamaindex', 'mastra', 'openai-agents', 'vercel-ai'];
          const groups = {
            abandoned: [
              ['holographic-memory', 'warm-memory', true],
              ['holographic-memory-mcp', 'warm-mcp', true],
              ...suffixes.map(s => [`holographic-memory-${s}`, 'warm-memory', true]),
              ...suffixes.map(s => [`warm-sdk-${s}`, 'warm-sdk', true]),
            ],
            'renamed-engine': [
              ['writerslogic-warm', 'warm-memory', false],
              ...suffixes.map(s => [`writerslogic-warm-${s}`, 'warm-memory', false]),
            ],
            'renamed-mcp': [['writerslogic-warm-mcp', 'warm-mcp', false]],
            'renamed-adapters': adapters.map(a => [`warm-${a}`, `@writerslogic/warm-${a}`, false]),
          };
          const entries = groups[process.env.GROUP];
          if (!entries) throw new Error('Invalid retirement group');
          const apply = process.env.APPLY === 'true';
          const clean = value => String(value ?? '').replaceAll(process.env.NODE_AUTH_TOKEN, '[redacted]');
          async function metadata(name) {
            const response = await fetch(`https://registry.npmjs.org/${name.replace('/', '%2f')}`, { signal: AbortSignal.timeout(30000) });
            if (response.status === 404) return null;
            if (!response.ok) throw new Error(`Registry lookup ${name}: HTTP ${response.status}`);
            return response.json();
          }
          function npm(args) {
            const run = spawnSync('npm', args, { encoding: 'utf8', timeout: 120000 });
            return { success: run.status === 0, output: clean(`${run.stdout ?? ''}${run.stderr ?? ''}${run.error?.message ?? ''}`) };
          }
          (async () => {
            const results = [];
            for (const [legacy, replacement, unpublish] of entries) {
              const record = { legacy, replacement };
              try {
                const old = await metadata(legacy);
                if (!old || !Object.keys(old.versions ?? {}).length) {
                  record.result = 'already_absent';
                } else {
                  record.versions = Object.keys(old.versions);
                  const current = await metadata(replacement);
                  if (!current?.['dist-tags']?.latest) throw new Error(`Replacement ${replacement} is not published; preserving ${legacy}`);
                  record.replacementVersion = current['dist-tags'].latest;
                  const message = unpublish
                    ? `Retired. Install ${replacement} instead.`
                    : `Renamed to ${replacement}. Install ${replacement} instead; this name receives no further releases.`;
                  if (!apply) {
                    record.result = unpublish ? 'would_unpublish_or_deprecate' : 'would_deprecate';
                  } else {
                    const removed = unpublish ? npm(['unpublish', legacy, '--force']) : { success: false, output: 'deprecation only' };
                    record.unpublish = removed.output;
                    if (removed.success) {
                      record.result = 'unpublished';
                    } else {
                      const deprecated = npm(['deprecate', `${legacy}@*`, message]);
                      record.deprecation = deprecated.output;
                      record.result = deprecated.success ? (unpublish ? 'deprecated_after_unpublish_denial' : 'deprecated') : 'failed';
                    }
                  }
                }
              } catch (error) {
                record.result = 'failed';
                record.error = clean(error.message);
              }
              results.push(record);
              fs.writeFileSync('legacy-npm-retirement.json', `${JSON.stringify(results, null, 2)}\n`);
              console.log(JSON.stringify({ legacy: record.legacy, result: record.result, error: record.error }));
            }
            if (results.some(r => r.result === 'failed')) process.exitCode = 1;
          })().catch(error => { console.error(clean(error.message)); process.exitCode = 1; });
          NODE
      - name: Preserve each registry result and policy denial
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-npm-retirement-${{ inputs.group }}
          path: legacy-npm-retirement.json
          if-no-files-found: warn
