name: win-diag
on:
  workflow_dispatch:
  push:
    branches: [fix/erase-and-crash-proofs]
    paths: [".github/workflows/win-diag.yml", "tests/win_diag.rs"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        nodirsync: ["", "1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: durability-windows-latest
          save-if: false
      - run: cargo test --features failpoints --test win_diag --no-run
      - name: Disk
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free
      - name: Diagnose
        env:
          WARM_DIAG_NO_DIRSYNC: ${{ matrix.nodirsync }}
        run: |
          if ($env:WARM_DIAG_NO_DIRSYNC -eq "") { Remove-Item Env:WARM_DIAG_NO_DIRSYNC }
          cargo test --features failpoints --test win_diag -- --exact win_diag --nocapture --test-threads=1
