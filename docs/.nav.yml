# Top-level order of the site. scripts/docs_site.py fails the build for any page that is missing
# from this tree. The home page is reached through the logo, not a tab.
nav:
  - Get started:
      - quickstart.md
      - concepts.md
  - Reference:
      - reference/api.md
      - API:
          - api/index.md
          - Rust: api/rust/index.md
          - Python:
              - api/python/**/*.md
          - Node and TypeScript:
              - api/node/index.md
              - api/node/**/*.md
          - api/http.md
          - api/c.md
          - api/**/*.md
      - file-format/index.md
      - reference/provenance-profile-v1.md
      - reference/faq.md
      - reference/changelog.md
  - Integrations:
      - integrations.md
  - Operations:
      - server/index.md
      - server/configuration.md
      - server/errors.md
      - security.md
  - Benchmarks:
      - benchmarks/index.md
      - benchmarks/COMPARISON.md
