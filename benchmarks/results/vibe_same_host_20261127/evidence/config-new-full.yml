# Grid pre-registered 2026-10-23 before any run at this revision.
# Arguments are positional in YAML order:
# WARM(metric, degree, build_ef, code_bits, query_aware) and set_query_arguments(ef, rerank).
# `ood: true` makes VIBE call fit_ood with the dataset's official learn split where the HDF5 file
# has one (the build samples 32768 learn rows, numpy seed 24301; see module.py); sets without a
# learn split call fit and build the plain graph from the same grid.
# VIBE limits: 6 build combinations and 56 query combinations per metric, each below
# the 20 / 60 guidance. The learn_mid and learn_tail groups are learn-heavy builds (projected_degree and learn_queries); the base group is the previously submitted builds, so the
# per-recall best over both groups can only match or exceed them. The ip section replaces those two with
# lists_small and lists_large: builds that also keep candidate lists learned from the learn queries (query_lists),
# searched with probes (probe_only true scans the probed lists alone, false continues into the graph). Query arguments: ef x rerank where a rerank
# above ef behaves as rerank = ef, and ef below 100 (k) behaves as 100, so neither is listed.
float:
  cosine:
  - name: warm
    module: vibe.algorithms.warm
    constructor: WARM
    singularity_image: warm
    disabled: false
    ood: true
    base_args: ['@metric']
    run_groups:
      base:
        args:
          degree: [32, 48, 64, 96]
          build_ef: [500]
          code_bits: [8]
          query_aware: [true]
        query_args:
          ef: [125, 150, 175, 200, 250, 300, 320, 400, 500, 650, 800, 1000, 1500, 2000]
          rerank: [125, 150, 200, 400]
      learn_mid:
        args:
          degree: [24]
          build_ef: [500]
          code_bits: [8]
          query_aware: [true]
          escape_edges: [false]
          reach_edges: [false]
          projected_degree: [64]
          training_neighbors: [100]
          training_ef: [0]
          learn_queries: [253921]
        query_args:
          ef: [125, 150, 175, 200, 250, 300, 320, 400, 500, 650, 800, 1000, 1500, 2000]
          rerank: [125, 150, 200, 400]
      learn_tail:
        args:
          degree: [32]
          build_ef: [500]
          code_bits: [8]
          query_aware: [true]
          escape_edges: [false]
          reach_edges: [false]
