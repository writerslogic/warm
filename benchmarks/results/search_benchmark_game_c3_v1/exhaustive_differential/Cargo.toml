[package]
name = "deepk"
version = "0.1.0"
edition = "2021"
[dependencies]
warm-rust = { path = "../warm" }  # the source tree under test (see README.md)
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = 1
[workspace]
